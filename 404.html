<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Rahmat Taufiqurrahman</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--ink:#eaf1ff;--muted:#a9bde6;--signal:#2563eb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:#e6eaf3;font-family:'Geist',system-ui,sans-serif}
.frame{width:min(640px,100%);padding:10px;border-radius:28px;background:linear-gradient(145deg,#ffffff,#8fa2c8 35%,#f0f4fb 60%,#9fb0d2);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.win{position:relative;border-radius:20px;overflow:hidden;padding:64px 32px 48px;background:radial-gradient(120% 90% at 85% 20%,rgba(91,127,208,.35),transparent 60%),radial-gradient(80% 60% at 10% 110%,rgba(234,88,12,.25),transparent 70%),#03050f;color:var(--ink);box-shadow:inset 0 0 0 1.5px #3b82f6}
.plate{position:absolute;left:50%;top:0;transform:translateX(-50%);height:24px;padding:0 14px 0 calc(14px + .3em);border-radius:0 0 8px 8px;background:#dfe7f6;display:flex;align-items:center;font:700 8.5px/1 'Geist Mono',monospace;letter-spacing:.3em;color:#0b1226;white-space:nowrap}
.k{font:600 12px/16px 'Geist Mono',monospace;letter-spacing:.14em;color:#8fb4ff}
h1{margin:12px 0 12px;font:600 40px/46px 'Plus Jakarta Sans',sans-serif;letter-spacing:-.02em}
p{margin:0 0 28px;font-size:16px;line-height:24px;color:var(--muted);max-width:420px}
a{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 22px;border-radius:12px;background:var(--signal);color:#fff;text-decoration:none;font:600 15px/20px 'Geist',sans-serif}
a:focus-visible{outline:2px solid #8fb4ff;outline-offset:3px}
@media (max-width:480px){.win{padding:56px 20px 32px}h1{font-size:30px;line-height:36px}}
</style>
</head>
<body>
<main class="frame"><div class="win">
<div class="plate">SIGNAL LOST</div>
<span class="k">ERROR 404</span>
<h1>This page drifted out of range.</h1>
<p>The link may be old or mistyped. Head back to the portfolio and pick a project from there.</p>
<a href="/">Back to the portfolio</a>
</div></main>
</body>
</html>
